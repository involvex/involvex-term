name: Publish CLI
permissions:
  contents: read

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w packages/cli
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w packages/sdk

      - name: Build CLI (bun build --target node)
        working-directory: packages/cli
        run: bun run build

      - name: Publish @involvex/term
        working-directory: packages/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @involvex/term-sdk
        working-directory: packages/sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
