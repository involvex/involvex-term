name: Release
permissions:
  contents: write
  packages: write
  id-token: write

on:
  push:
    tags:
      - v*
  # Rebuild/attach artifacts to an existing release (uses this workflow from main).
  # Example: gh workflow run release.yml -f tag=v0.5.1
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach artifacts to (e.g. v0.5.1)
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      # softprops uploads; electron-builder must never publish (avoids draft/release clash)
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun scripts/generate-icon.mjs

      # build:release = electron-builder --publish never (no link-latest; no GH upload)
      - name: Build
        run: bun run build:release

      - name: Upload Windows artifact
        if: matrix.platform == 'win'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            release/**/involvex-term-Windows-*-Setup.exe
            release/**/involvex-term-Windows-*-Setup.exe.blockmap
            release/**/involvex-term-Windows-*-Portable.exe
            release/**/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            release/**/involvex-term-Linux-*.AppImage
            release/**/latest-linux.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
